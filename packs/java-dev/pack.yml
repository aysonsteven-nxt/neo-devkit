id: java-dev
name: Java Development
version: 1.0.0
description: Professional Java development covering Java SE, Spring Boot, APIs, testing, and maintainable application architecture.
dependencies:
  - project-manager
conflicts: []
provides:
  - java
  - java-se
  - spring-boot
  - java-testing
selector:
  always: 0
  signals:
    - id: java
      weight: 60
      reason: Java source/build markers were detected.
    - id: spring
      weight: 30
      reason: Spring/Spring Boot markers were detected.
    - id: maven
      weight: 15
      reason: Maven build configuration was detected.
    - id: gradle-java
      weight: 10
      reason: Java + Gradle markers were detected.
    - id: rest
      weight: 15
      reason: REST/API markers were detected.
